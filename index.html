<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff681f"><meta name="apple-mobile-web-app-capable" content="yes"><title>Tierfreunde · Memory</title><link rel="icon" type="image/svg+xml" href="assets/logo.svg"><link rel="stylesheet" href="style.css"></head>
<body>
<main>
<section class="game" aria-label="Memory-Spiel">
<header class="game-toolbar"><button id="restart" class="tool-button" aria-label="Neues Spiel"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M24 10a10 10 0 1 0 2 11"/><path d="M24 3v8h-8"/></svg></button><div class="logo-tab"><img class="game-logo" src="assets/logo.svg" alt="Tierfreunde" width="48" height="48"></div><button id="sound" class="tool-button" aria-label="Ton ausschalten" aria-pressed="true"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 12h5l7-6v20l-7-6H5z"/><path class="sound-waves" d="M22 11q5 5 0 10m4-14q9 9 0 18"/><path class="sound-slash" d="m21 12 8 8m0-8-8 8"/></svg></button></header>
<div class="progress-track sr-only" role="progressbar" aria-label="Gefundene Paare" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"><div id="progress"></div></div>
<div id="board" class="board"></div>
<div class="game-footer"><div class="levels" aria-label="Kartenzahl"><button data-pairs="3" aria-label="6 Karten"><svg class="level-stack" viewBox="0 0 34 34" aria-hidden="true"><rect x="2" y="2" width="16" height="19" rx="2"/><rect x="6" y="5" width="16" height="19" rx="2"/></svg></button><button data-pairs="6" class="active" aria-label="12 Karten" aria-pressed="true"><svg class="level-stack" viewBox="0 0 34 34" aria-hidden="true"><rect x="2" y="2" width="16" height="19" rx="2"/><rect x="6" y="5" width="16" height="19" rx="2"/><rect x="10" y="8" width="16" height="19" rx="2"/></svg></button><button data-pairs="10" aria-label="20 Karten"><svg class="level-stack" viewBox="0 0 34 34" aria-hidden="true"><rect x="2" y="2" width="16" height="19" rx="2"/><rect x="6" y="5" width="16" height="19" rx="2"/><rect x="10" y="8" width="16" height="19" rx="2"/><rect x="14" y="11" width="16" height="19" rx="2"/></svg></button></div></div><span id="hint" class="sr-only" role="status" aria-live="polite"></span>
</section>
</main>
<dialog id="victory" aria-label="Alle Tierpaare gefunden"><div class="victory-icon" aria-hidden="true"><svg viewBox="0 0 100 100"><path fill="#f5c640" stroke="#2345a3" stroke-width="3" stroke-linejoin="round" d="m50 8 12 27 30 3-23 20 7 31-26-16-26 16 7-31L8 38l30-3z"/></svg></div><p id="result" class="sr-only"></p><button id="again" aria-label="Noch eine Runde">↻</button><button id="close-dialog" aria-label="Tiere noch einmal ansehen"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 16s5-9 13-9 13 9 13 9-5 9-13 9S3 16 3 16z"/><circle cx="16" cy="16" r="4"/></svg></button></dialog>
<div id="confetti" aria-hidden="true"></div>
<script src="app.js?v=audio-2"></script>
</body></html>
